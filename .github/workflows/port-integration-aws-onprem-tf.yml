name: port-integration-aws-onprem-tf

# -----------------------------------------------------------------------------
# ENVIRONMENT rules (invariants):
#   1. ENVIRONMENT is set by the pipeline only — never a GitHub variable.
#   2. pull_request → integration; push to main → production.
#   3. workflow_dispatch → required input (no default).
#   4. ENVIRONMENT must match: GitHub Actions environment name,
#      terraform/environments/<name>.tfvars, and TFC workspace suffix
#      ($TFC_WORKSPACE_SLUG-$ENVIRONMENT).
#   5. Production deploy gate: GitHub environment protection on `production`
#      (restrict to main) — not enforced in this YAML.
#
# Per-environment config: GitHub → Settings → Environments → <name>
#   Variables: TFC_ORGANIZATION, TFC_WORKSPACE_SLUG, TFC_WORKSPACE_TAGS,
#              AWS_REGION, AWS_ACCOUNT_ID, AWS_ROLE_NAME, PORT_CLIENT_ID
#   Secrets: TF_API_TOKEN, PORT_CLIENT_SECRET, PORT_LIVE_EVENTS_API_KEY
#            (+ AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY if static creds)
#
# Pipeline defaults (workflow env — edit in this file, not GitHub variables):
#   TERRAFORM_VERSION — Terraform CLI for hashicorp/setup-terraform (default 1.14.5;
#                       must satisfy terraform/terraform.tf required_version)
#
# Architectural flags (terraform job env — not GitHub variables):
#   USE_TERRAFORM_CLOUD_BACKEND — where Terraform state lives (TFC vs S3/local)
#   USE_AWS_STATIC_CREDENTIALS  — OIDC vs static AWS keys (independent of backend)
# Valid combinations:
#   TFC=true  + static=false → TFC state, OIDC (default)
#   TFC=true  + static=true  → TFC state, static keys
#   TFC=false + static=false → S3/local state, OIDC
#   TFC=false + static=true  → S3/local state, static keys
# -----------------------------------------------------------------------------

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/port-integration-aws-onprem-tf.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/port-integration-aws-onprem-tf.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: >-
          Target environment — must match a GitHub Actions environment,
          terraform/environments/<name>.tfvars, and TFC workspace suffix.
          No default: explicit selection required.
        required: true
        type: choice
        options:
          - integration
          - production
      mode:
        description: "Terraform operation"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
      tf_workspace:
        description: >-
          Optional full Terraform Cloud workspace name override (bypasses
          TFC_WORKSPACE_SLUG-$ENVIRONMENT convention)
        required: false
        type: string
        default: ""
      tfvar_file:
        description: >-
          Optional varfile path override under terraform/ (default:
          environments/$ENVIRONMENT.tfvars)
        required: false
        type: string
        default: ""
      aws_region:
        description: "Overrides AWS_REGION when set; must match aws_region in your varfile"
        required: false
        type: string
        default: ""
      aws_account_id:
        description: "Overrides AWS_ACCOUNT_ID when set (OIDC role ARN account segment)"
        required: false
        type: string
        default: ""
      aws_role_name:
        description: "Overrides AWS_ROLE_NAME when set (IAM role name only, not full ARN)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  # Terraform CLI for format + plan/apply/destroy.
  TERRAFORM_VERSION: "1.14.5"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -check -recursive

  terraform:
    needs: [format]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # ENVIRONMENT drives GitHub Actions environment (secrets/vars) AND
    # terraform/environments/$ENVIRONMENT.tfvars — keep both expressions identical.
    environment: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.environment ||
          github.ref == 'refs/heads/main' && 'production' || 'integration' }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: >-
        port-integration-aws-${{ github.event_name == 'workflow_dispatch' && inputs.environment ||
          github.ref == 'refs/heads/main' && 'production' || 'integration' }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.environment ||
            github.ref == 'refs/heads/main' && 'production' || 'integration' }}
      # --- Backend: where Terraform state is stored (all environments) ---
      USE_TERRAFORM_CLOUD_BACKEND: "true"
      # --- AWS auth: OIDC (false) vs static key/secret (true) — independent of backend ---
      USE_AWS_STATIC_CREDENTIALS: "false"
      TF_MODE: >-
        ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode ||
        (github.event_name == 'pull_request' && 'plan' ||
          github.event_name == 'push' && 'apply') }}
      AWS_REGION: >-
        ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.aws_region ||
          vars.AWS_REGION }}
      AWS_ACCOUNT_ID: >-
        ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.aws_account_id ||
          vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_NAME: >-
        ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.aws_role_name ||
          vars.AWS_ROLE_NAME }}
      TF_AWS_ROLE_ARN: >-
        ${{ format('arn:aws:iam::{0}:role/{1}',
            github.event_name == 'workflow_dispatch' && github.event.inputs.aws_account_id ||
              vars.AWS_ACCOUNT_ID,
            github.event_name == 'workflow_dispatch' && github.event.inputs.aws_role_name ||
              vars.AWS_ROLE_NAME) }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
      TF_VAR_port_client_id: ${{ vars.PORT_CLIENT_ID }}
      TF_VAR_port_client_secret: ${{ secrets.PORT_CLIENT_SECRET }}
      TF_VAR_live_events_api_key: ${{ secrets.PORT_LIVE_EVENTS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set derived variables
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tfvar_file }}" ]; then
            echo "TFVAR_FILE=${{ github.event.inputs.tfvar_file }}" >> "$GITHUB_ENV"
          else
            echo "TFVAR_FILE=environments/${ENVIRONMENT}.tfvars" >> "$GITHUB_ENV"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tf_workspace }}" ]; then
            echo "TF_WORKSPACE=${{ github.event.inputs.tf_workspace }}" >> "$GITHUB_ENV"
          else
            echo "TF_WORKSPACE=${{ vars.TFC_WORKSPACE_SLUG }}-${ENVIRONMENT}" >> "$GITHUB_ENV"
          fi

      - name: Validate inputs
        run: |
          set -euo pipefail
          missing=()
          if [ "${{ env.USE_TERRAFORM_CLOUD_BACKEND }}" != "false" ]; then
            [ -z "${{ vars.TFC_ORGANIZATION }}" ] && missing+=(TFC_ORGANIZATION)
            [ -z "${{ vars.TFC_WORKSPACE_SLUG }}" ] && missing+=(TFC_WORKSPACE_SLUG)
            [ -z "$TF_WORKSPACE" ] && missing+=(TF_WORKSPACE)
            [ -z "${{ vars.TFC_WORKSPACE_TAGS }}" ] && missing+=(TFC_WORKSPACE_TAGS)
          fi
          if [ ! -f "terraform/$TFVAR_FILE" ]; then
            echo "::error::Varfile not found: terraform/$TFVAR_FILE"
            echo "Copy environments/example.tfvars to environments/${ENVIRONMENT}.tfvars (or your environment name)."
            exit 1
          fi
          if [ "${{ env.USE_AWS_STATIC_CREDENTIALS }}" != "true" ]; then
            [ -z "$AWS_REGION" ] && missing+=(AWS_REGION)
            [ -z "$AWS_ACCOUNT_ID" ] && missing+=(AWS_ACCOUNT_ID)
            [ -z "$AWS_ROLE_NAME" ] && missing+=(AWS_ROLE_NAME)
          fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing or empty: ${missing[*]}"
            echo "Set each value in GitHub → Settings → Environments → ${ENVIRONMENT}"
            echo "  (Variables and Secrets for that environment)."
            echo "Optional workflow_dispatch inputs override AWS_* when non-empty."
            echo "TFC workspace defaults to TFC_WORKSPACE_SLUG-ENVIRONMENT unless tf_workspace is set."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          cli_config_credentials_token: >-
            ${{ env.USE_TERRAFORM_CLOUD_BACKEND != 'false' &&
              secrets.TF_API_TOKEN || '' }}

      - name: Configure AWS credentials (OIDC)
        if: ${{ env.USE_AWS_STATIC_CREDENTIALS != 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (static)
        if: ${{ env.USE_AWS_STATIC_CREDENTIALS == 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform Cloud workspace
        id: ensure_workspace
        if: ${{ env.USE_TERRAFORM_CLOUD_BACKEND != 'false' }}
        uses: gossamer-labs/gha-ensure-tfc-workspace@v1.1.0
        with:
          tfc_token: ${{ secrets.TF_API_TOKEN }}
          organization: ${{ vars.TFC_ORGANIZATION }}
          workspace_name: ${{ env.TF_WORKSPACE }}
          workspace_tags: ${{ vars.TFC_WORKSPACE_TAGS }}
          execution_mode: local
          create_if_missing: >-
            ${{ github.event_name != 'workflow_dispatch' ||
              github.event.inputs.mode != 'destroy' }}

      - name: Terraform init
        if: >-
          ${{ env.TF_MODE == 'plan' || env.TF_MODE == 'apply' ||
            (env.TF_MODE == 'destroy' && (
              env.USE_TERRAFORM_CLOUD_BACKEND == 'false' ||
              env.USE_TERRAFORM_CLOUD_BACKEND != 'false' &&
                steps.ensure_workspace.outputs.workspace_exists == 'true'
            )) }}
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform validate
        if: ${{ env.TF_MODE != 'destroy' }}
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        if: ${{ env.TF_MODE == 'plan' }}
        working-directory: terraform
        run: terraform plan -input=false -var-file="$TFVAR_FILE"

      - name: Terraform apply
        if: ${{ env.TF_MODE == 'apply' }}
        working-directory: terraform
        run: terraform apply -auto-approve -input=false -var-file="$TFVAR_FILE"

      - name: Terraform destroy
        if: >-
          ${{ env.TF_MODE == 'destroy' && (
              env.USE_TERRAFORM_CLOUD_BACKEND == 'false' ||
              env.USE_TERRAFORM_CLOUD_BACKEND != 'false' &&
                steps.ensure_workspace.outputs.workspace_exists == 'true'
            ) }}
        working-directory: terraform
        run: terraform destroy -auto-approve -input=false -var-file="$TFVAR_FILE"
