name: port-integration-aws-onprem-tf

# -----------------------------------------------------------------------------
# ENVIRONMENT rules (invariants):
#   1. ENVIRONMENT is set by the pipeline only — never a GitHub variable.
#   2. pull_request and push (non-trunk) → development; push to default branch → production.
#      Trunk = github.event.repository.default_branch (refs/heads/<name> on push).
#   3. workflow_dispatch → required environment input; mode is plan (no apply) or destroy.
#   4. ENVIRONMENT must match: GitHub Actions environment name,
#      terraform/environments/<name>.tfvars, and TFC workspace suffix
#      ($TFC_WORKSPACE_SLUG-$ENVIRONMENT).
#   5. Production deploy gate: GitHub environment protection on `production`
#      (restrict to default branch) — not enforced in this YAML.
#
# Triggers → Terraform:
#   pull_request        → plan (artifact), apply (development)
#   push (non-trunk)    → plan (artifact), apply (development)
#   push (trunk)        → plan (artifact), apply (production)
#   workflow_dispatch   → plan (artifact) or destroy (chosen environment); no apply
#
# Per-environment config: GitHub → Settings → Environments → <name>
#   Variables: TFC_ORGANIZATION, TFC_WORKSPACE_SLUG, TFC_WORKSPACE_TAGS,
#              AWS_REGION, AWS_ACCOUNT_ID, AWS_ROLE_NAME, PORT_CLIENT_ID
#   Secrets: TF_API_TOKEN, PORT_CLIENT_SECRET, PORT_LIVE_EVENTS_API_KEY
#            (+ AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY if static creds)
#
# Pipeline defaults (workflow env — edit in this file, not GitHub variables):
#   TERRAFORM_VERSION — Terraform CLI for hashicorp/setup-terraform (default 1.14.5;
#                       must satisfy terraform/terraform.tf required_version)
#
# Architectural flags (terraform job env — not GitHub variables):
#   USE_TERRAFORM_CLOUD_BACKEND — where Terraform state lives (TFC vs S3/local)
#   USE_AWS_STATIC_CREDENTIALS  — OIDC vs static AWS keys (independent of backend)
# Valid combinations:
#   TFC=true  + STATIC=false → TFC state, OIDC (default)
#   TFC=true  + STATIC=true  → TFC state, static keys
#   TFC=false + STATIC=false → S3/local state, OIDC
#   TFC=false + STATIC=true  → S3/local state, static keys
# -----------------------------------------------------------------------------

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/port-integration-aws-onprem-tf.yml"
  push:
    paths:
      - "terraform/**"
      - ".github/workflows/port-integration-aws-onprem-tf.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: >-
          Target environment — must match a GitHub Actions environment,
          terraform/environments/<name>.tfvars, and TFC workspace suffix.
          No default: explicit selection required.
        required: true
        type: choice
        options:
          - development
          - production
      mode:
        description: "Terraform operation"
        required: true
        type: choice
        options:
          - plan
          - destroy
        default: plan

permissions:
  contents: read

env:
  # Terraform CLI for format + plan/apply/destroy.
  TERRAFORM_VERSION: "1.14.5"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -check -recursive

  terraform:
    needs: [format]
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    # environment and concurrency cannot use env context — keep in sync
    environment: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.environment ||
          (github.event_name == 'push' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
            'production') ||
          'development' }}
    concurrency:
      group: >-
        port-integration-aws-${{ github.event_name == 'workflow_dispatch' && inputs.environment ||
          (github.event_name == 'push' &&
            github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
            'production') ||
          'development' }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.environment ||
            (github.event_name == 'push' &&
              github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
              'production') ||
            'development' }}
      RUN_PLAN: >-
        ${{ github.event_name == 'pull_request' ||
            github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'plan') }}
      RUN_APPLY: >-
        ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
      RUN_DESTROY: >-
        ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'destroy' }}
      # Terraform backend: where Terraform state is stored (all environments)
      USE_TERRAFORM_CLOUD_BACKEND: "true"
      # AWS auth: OIDC (false) vs static key/secret (true) — independent of backend
      USE_AWS_STATIC_CREDENTIALS: "false"
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_NAME: ${{ vars.AWS_ROLE_NAME }}
      TF_AWS_ROLE_ARN: >-
        ${{ format('arn:aws:iam::{0}:role/{1}', vars.AWS_ACCOUNT_ID, vars.AWS_ROLE_NAME) }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
      TF_VAR_port_client_id: ${{ vars.PORT_CLIENT_ID }}
      TF_VAR_port_client_secret: ${{ secrets.PORT_CLIENT_SECRET }}
      TF_VAR_live_events_api_key: ${{ secrets.PORT_LIVE_EVENTS_API_KEY }}
      TF_PLAN_FILE: tfplan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set derived variables
        run: |
          set -euo pipefail
          echo "TFVAR_FILE=environments/${ENVIRONMENT}.tfvars" >> "$GITHUB_ENV"
          echo "TF_WORKSPACE=${{ vars.TFC_WORKSPACE_SLUG }}-${ENVIRONMENT}" >> "$GITHUB_ENV"

      - name: Validate GitHub Actions environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=$(gh api "/repos/${GITHUB_REPOSITORY}/environments" \
            --jq "([.environments[].name] | index(\"${ENVIRONMENT}\")) != null")
          [ "$found" = "true" ] || {
            echo "::error::GitHub Actions environment '${ENVIRONMENT}' not found."
            echo "Create it under Settings → Environments, then re-run."
            exit 1
          }

      - name: Validate environment config
        run: |
          set -euo pipefail
          if [ ! -f "terraform/$TFVAR_FILE" ]; then
            echo "::error::Varfile not found: terraform/$TFVAR_FILE"
            echo "ENVIRONMENT must match terraform/environments/<name>.tfvars (e.g. environments/${ENVIRONMENT}.tfvars)."
            exit 1
          fi

          missing=()
          if [ "${{ env.USE_TERRAFORM_CLOUD_BACKEND }}" != "false" ]; then
            [ -z "${{ vars.TFC_ORGANIZATION }}" ] && missing+=(TFC_ORGANIZATION)
            [ -z "${{ vars.TFC_WORKSPACE_SLUG }}" ] && missing+=(TFC_WORKSPACE_SLUG)
            [ -z "${{ vars.TFC_WORKSPACE_TAGS }}" ] && missing+=(TFC_WORKSPACE_TAGS)
            [ -z "${{ secrets.TF_API_TOKEN }}" ] && missing+=(TF_API_TOKEN)
          fi
          if [ "${{ env.USE_AWS_STATIC_CREDENTIALS }}" = "true" ]; then
            [ -z "$AWS_REGION" ] && missing+=(AWS_REGION)
            [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && missing+=(AWS_ACCESS_KEY_ID)
            [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && missing+=(AWS_SECRET_ACCESS_KEY)
          else
            [ -z "$AWS_REGION" ] && missing+=(AWS_REGION)
            [ -z "$AWS_ACCOUNT_ID" ] && missing+=(AWS_ACCOUNT_ID)
            [ -z "$AWS_ROLE_NAME" ] && missing+=(AWS_ROLE_NAME)
          fi
          [ -z "${{ vars.PORT_CLIENT_ID }}" ] && missing+=(PORT_CLIENT_ID)
          [ -z "$TF_VAR_port_client_secret" ] && missing+=(PORT_CLIENT_SECRET)
          [ -z "$TF_VAR_live_events_api_key" ] && missing+=(PORT_LIVE_EVENTS_API_KEY)

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing or empty: ${missing[*]}"
            echo "Set each in GitHub → Settings → Environments → ${ENVIRONMENT} (Variables and Secrets)."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          cli_config_credentials_token: >-
            ${{ env.USE_TERRAFORM_CLOUD_BACKEND != 'false' &&
              secrets.TF_API_TOKEN || '' }}

      - name: Configure AWS credentials (OIDC)
        if: ${{ env.USE_AWS_STATIC_CREDENTIALS != 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (static)
        if: ${{ env.USE_AWS_STATIC_CREDENTIALS == 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform Cloud workspace
        id: ensure_workspace
        if: ${{ env.USE_TERRAFORM_CLOUD_BACKEND != 'false' }}
        uses: gossamer-labs/gha-ensure-tfc-workspace@v1.1.0
        with:
          tfc_token: ${{ secrets.TF_API_TOKEN }}
          organization: ${{ vars.TFC_ORGANIZATION }}
          workspace_name: ${{ env.TF_WORKSPACE }}
          workspace_tags: ${{ vars.TFC_WORKSPACE_TAGS }}
          execution_mode: local
          create_if_missing: >-
            ${{ github.event_name != 'workflow_dispatch' ||
              github.event.inputs.mode != 'destroy' }}

      - name: Terraform init
        if: >-
          ${{ env.RUN_PLAN == 'true' || env.RUN_APPLY == 'true' ||
            (env.RUN_DESTROY == 'true' && (
              env.USE_TERRAFORM_CLOUD_BACKEND == 'false' ||
              env.USE_TERRAFORM_CLOUD_BACKEND != 'false' &&
                steps.ensure_workspace.outputs.workspace_exists == 'true'
            )) }}
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform validate
        if: ${{ env.RUN_PLAN == 'true' || env.RUN_APPLY == 'true' }}
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan (artifact)
        if: ${{ env.RUN_PLAN == 'true' && env.RUN_DESTROY != 'true' }}
        working-directory: terraform
        run: terraform plan -input=false -var-file="$TFVAR_FILE" -out="$TF_PLAN_FILE"

      - name: Upload Terraform plan
        if: ${{ env.RUN_PLAN == 'true' && env.RUN_DESTROY != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENVIRONMENT }}-${{ github.run_id }}
          path: terraform/${{ env.TF_PLAN_FILE }}
          retention-days: 3

      - name: Terraform apply
        if: ${{ env.RUN_APPLY == 'true' }}
        working-directory: terraform
        run: terraform apply -input=false -auto-approve "$TF_PLAN_FILE"

      - name: Terraform destroy
        if: >-
          ${{ env.RUN_DESTROY == 'true' && (
              env.USE_TERRAFORM_CLOUD_BACKEND == 'false' ||
              env.USE_TERRAFORM_CLOUD_BACKEND != 'false' &&
                steps.ensure_workspace.outputs.workspace_exists == 'true'
            ) }}
        working-directory: terraform
        run: terraform destroy -auto-approve -input=false -var-file="$TFVAR_FILE"
