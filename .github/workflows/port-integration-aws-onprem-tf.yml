name: port-integration-aws-onprem-tf

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/port-integration-aws-onprem-tf.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/port-integration-aws-onprem-tf.yml"
  # Manual runs: GitHub does not show repository Variables in the Run workflow form—only static YAML
  # defaults (e.g. Terraform operation). Leave any string input blank to use the matching repository
  # Variable (same resolution as push to main). Only Terraform operation must be selected.
  workflow_dispatch:
    inputs:
      mode:
        description: "Terraform operation"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
      tf_workspace:
        description: >-
          Overrides TFC_WORKSPACE when set; workspace must exist (or be
          creatable) when not destroying
        required: false
        type: string
        default: ""
      tfvar_file:
        description: >-
          Overrides TFVAR_FILE when set — path under terraform/ (copy from
          varfiles/example.tfvars, e.g. varfiles/mystack.tfvars)
        required: false
        type: string
        default: ""
      aws_region:
        description: "Overrides AWS_REGION when set; must match aws_region in your varfile"
        required: false
        type: string
        default: ""
      aws_account_id:
        description: "Overrides AWS_ACCOUNT_ID when set (OIDC role ARN account segment)"
        required: false
        type: string
        default: ""
      aws_role_name:
        description: "Overrides AWS_ROLE_NAME when set (IAM role name only, not full ARN)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -check -recursive

  terraform:
    needs: [format]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: >-
        port-integration-aws-${{ github.event_name == 'workflow_dispatch' &&
          github.event.inputs.tfvar_file || vars.TFVAR_FILE }}
      cancel-in-progress: false
    # Repository Variables (no hardcoded fallbacks): TFC_ORGANIZATION, TFC_WORKSPACE, TFC_WORKSPACE_TAGS,
    # TFVAR_FILE, AWS_REGION, AWS_ACCOUNT_ID, AWS_ROLE_NAME. workflow_dispatch strings override when non-empty.
    # Set USE_TERRAFORM_CLOUD_BACKEND=false when using S3/local backend (skips ensure-tfc-workspace; TFC_* not required).
    # Set AWS_USE_STATIC_CREDENTIALS=true to use AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY instead of OIDC.
    # Partial cloud backend: TF_CLOUD_ORGANIZATION from TFC_ORGANIZATION; TF_WORKSPACE from TFC_WORKSPACE or dispatch.
    env:
      TF_MODE: >-
        ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode ||
        (github.event_name == 'pull_request' && 'plan' ||
          github.event_name == 'push' && 'apply') }}
      TF_WORKSPACE: >-
        ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tf_workspace ||
          vars.TFC_WORKSPACE }}
      TFVAR_FILE: >-
        ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tfvar_file ||
          vars.TFVAR_FILE }}
      AWS_REGION: >-
        ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.aws_region ||
          vars.AWS_REGION }}
      AWS_ACCOUNT_ID: >-
        ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.aws_account_id ||
          vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_NAME: >-
        ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.aws_role_name ||
          vars.AWS_ROLE_NAME }}
      TF_AWS_ROLE_ARN: >-
        ${{ format('arn:aws:iam::{0}:role/{1}',
            github.event_name == 'workflow_dispatch' && github.event.inputs.aws_account_id ||
              vars.AWS_ACCOUNT_ID,
            github.event_name == 'workflow_dispatch' && github.event.inputs.aws_role_name ||
              vars.AWS_ROLE_NAME) }}
      TF_CLOUD_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
      TF_VAR_port_client_id: ${{ secrets.PORT_CLIENT_ID }}
      TF_VAR_port_client_secret: ${{ secrets.PORT_CLIENT_SECRET }}
      TF_VAR_live_events_api_key: ${{ secrets.PORT_LIVE_EVENTS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate inputs
        run: |
          set -euo pipefail
          missing=()
          if [ "${{ vars.USE_TERRAFORM_CLOUD_BACKEND }}" != "false" ]; then
            [ -z "${{ vars.TFC_ORGANIZATION }}" ] && missing+=(TFC_ORGANIZATION)
            [ -z "$TF_WORKSPACE" ] && missing+=(TFC_WORKSPACE)
            [ -z "${{ vars.TFC_WORKSPACE_TAGS }}" ] && missing+=(TFC_WORKSPACE_TAGS)
          fi
          [ -z "$TFVAR_FILE" ] && missing+=(TFVAR_FILE)
          if [ "${{ vars.AWS_USE_STATIC_CREDENTIALS }}" != "true" ]; then
            [ -z "$AWS_REGION" ] && missing+=(AWS_REGION)
            [ -z "$AWS_ACCOUNT_ID" ] && missing+=(AWS_ACCOUNT_ID)
            [ -z "$AWS_ROLE_NAME" ] && missing+=(AWS_ROLE_NAME)
          fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing or empty: ${missing[*]}"
            echo "Provide each value via GitHub Actions repository Variables"
            echo "(Settings → Secrets and variables → Actions → Variables)"
            echo "and/or non-empty workflow_dispatch inputs:"
            echo "  TFVAR_FILE — path under terraform/, e.g. varfiles/your-install.tfvars"
            echo "  TFC_ORGANIZATION, TFC_WORKSPACE, TFC_WORKSPACE_TAGS — when using Terraform Cloud (default)"
            echo "  AWS_REGION, AWS_ACCOUNT_ID, AWS_ROLE_NAME — for OIDC (unless AWS_USE_STATIC_CREDENTIALS=true)"
            echo "Blank dispatch fields use the same repository Variables as push to main."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.5
          cli_config_credentials_token: >-
            ${{ vars.USE_TERRAFORM_CLOUD_BACKEND != 'false' &&
              secrets.TF_API_TOKEN || '' }}

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_USE_STATIC_CREDENTIALS != 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (static)
        if: ${{ vars.AWS_USE_STATIC_CREDENTIALS == 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform Cloud workspace
        id: ensure_workspace
        if: ${{ vars.USE_TERRAFORM_CLOUD_BACKEND != 'false' }}
        uses: gossamer-labs/gha-ensure-tfc-workspace@c466a68766c8f7680e37b41960b8143d2e7d9a83  # v1.0.0
        with:
          tfc_token: ${{ secrets.TF_API_TOKEN }}
          organization: ${{ vars.TFC_ORGANIZATION }}
          workspace_name: ${{ env.TF_WORKSPACE }}
          workspace_tags: ${{ vars.TFC_WORKSPACE_TAGS }}
          execution_mode: local
          create_if_missing: >-
            ${{ github.event_name != 'workflow_dispatch' ||
              github.event.inputs.mode != 'destroy' }}

      - name: Terraform init
        if: >-
          ${{ env.TF_MODE == 'plan' || env.TF_MODE == 'apply' ||
            (env.TF_MODE == 'destroy' && (
              vars.USE_TERRAFORM_CLOUD_BACKEND == 'false' ||
              vars.USE_TERRAFORM_CLOUD_BACKEND != 'false' &&
                steps.ensure_workspace.outputs.workspace_exists == 'true'
            )) }}
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform validate
        if: ${{ env.TF_MODE != 'destroy' }}
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        if: ${{ env.TF_MODE == 'plan' }}
        working-directory: terraform
        run: terraform plan -input=false -var-file="$TFVAR_FILE"

      - name: Terraform apply
        if: ${{ env.TF_MODE == 'apply' }}
        working-directory: terraform
        run: terraform apply -auto-approve -input=false -var-file="$TFVAR_FILE"

      - name: Terraform destroy
        if: >-
          ${{ env.TF_MODE == 'destroy' && (
              vars.USE_TERRAFORM_CLOUD_BACKEND == 'false' ||
              vars.USE_TERRAFORM_CLOUD_BACKEND != 'false' &&
                steps.ensure_workspace.outputs.workspace_exists == 'true'
            ) }}
        working-directory: terraform
        run: terraform destroy -auto-approve -input=false -var-file="$TFVAR_FILE"
