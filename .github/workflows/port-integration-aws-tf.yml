name: port-integration-aws-tf

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/port-integration-aws-tf.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/port-integration-aws-tf.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Terraform operation"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
      tf_workspace:
        description: Terraform Cloud workspace name (tagged with port-integration-aws-tf)
        required: true
        type: string
      aws_region:
        description: AWS region for OIDC (must match terraform.tfvars aws_region)
        required: true
        default: us-east-2
        type: string
      aws_role_arn:
        description: IAM role for GitHub OIDC
        required: false
        default: arn:aws:iam::936835732720:role/github-actions-deploy
        type: string

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -check -recursive

  terraform:
    needs: [format]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: port-integration-aws-tf-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tf_workspace || vars.TFC_WORKSPACE || 'port-integration-aws-tf' }}
      cancel-in-progress: false
    # TF_WORKSPACE selects one Terraform Cloud workspace when multiple match tag port-integration-aws-tf.
    # PR / push to main: optional repository Variables TFC_WORKSPACE, AWS_REGION, AWS_ROLE_ARN (defaults in env below).
    # Phase 2 live events: add TF_VAR_live_events_api_key: ${{ secrets.PORT_LIVE_EVENTS_API_KEY }} when ready.
    env:
      TF_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || (github.event_name == 'pull_request' && 'plan' || github.event_name == 'push' && 'apply') }}
      TF_WORKSPACE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tf_workspace || vars.TFC_WORKSPACE || 'port-integration-aws-tf' }}
      AWS_REGION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.aws_region || vars.AWS_REGION || 'us-east-2' }}
      TF_AWS_ROLE_ARN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.aws_role_arn || vars.AWS_ROLE_ARN || 'arn:aws:iam::936835732720:role/github-actions-deploy' }}
      TF_VAR_port_client_id: ${{ secrets.PORT_CLIENT_ID }}
      TF_VAR_port_client_secret: ${{ secrets.PORT_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.5
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Terraform Cloud workspace
        id: ensure_workspace
        uses: ./.github/actions/ensure-tfc-workspace
        with:
          tfc_token: ${{ secrets.TF_API_TOKEN }}
          organization: gossamer-labs
          workspace_name: ${{ env.TF_WORKSPACE }}
          workspace_tags: port-integration-aws-tf
          execution_mode: local
          create_if_missing: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'destroy' }}

      - name: Terraform init
        if: ${{ env.TF_MODE == 'apply' || env.TF_MODE == 'plan' || steps.ensure_workspace.outputs.workspace_exists == 'true' }}
        working-directory: terraform
        run: terraform init -upgrade -input=false

      - name: Terraform format
        if: ${{ env.TF_MODE != 'destroy' }}
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        if: ${{ env.TF_MODE != 'destroy' }}
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        if: ${{ env.TF_MODE == 'plan' }}
        working-directory: terraform
        run: terraform plan -input=false

      - name: Terraform apply
        if: ${{ env.TF_MODE == 'apply' }}
        working-directory: terraform
        run: terraform apply -auto-approve -input=false

      - name: Terraform destroy
        if: ${{ env.TF_MODE == 'destroy' && steps.ensure_workspace.outputs.workspace_exists == 'true' }}
        working-directory: terraform
        run: terraform destroy -auto-approve -input=false
