name: Ensure Terraform Cloud Workspace
description: Ensure a Terraform Cloud workspace exists, is local execution mode, and has required tags.

inputs:
  tfc_token:
    description: Terraform Cloud API token.
    required: true
  organization:
    description: Terraform Cloud organization name.
    required: true
  workspace_name:
    description: Workspace name to ensure.
    required: true
  create_if_missing:
    description: Whether to create workspace when missing.
    required: false
    default: "true"
  execution_mode:
    description: Workspace execution mode.
    required: false
    default: local
  workspace_tags:
    description: Comma-separated list of tags to ensure.
    required: false

outputs:
  workspace_exists:
    description: Whether the workspace exists after this action.
    value: ${{ steps.ensure.outputs.workspace_exists }}
  workspace_id:
    description: Workspace ID when available.
    value: ${{ steps.ensure.outputs.workspace_id }}

runs:
  using: composite
  steps:
    - id: ensure
      shell: bash
      env:
        TFC_TOKEN: ${{ inputs.tfc_token }}
        TFC_ORG: ${{ inputs.organization }}
        TFC_WORKSPACE_NAME: ${{ inputs.workspace_name }}
        CREATE_IF_MISSING: ${{ inputs.create_if_missing }}
        EXECUTION_MODE: ${{ inputs.execution_mode }}
        WORKSPACE_TAGS: ${{ inputs.workspace_tags }}
      run: |
        set -euo pipefail

        workspace_url="https://app.terraform.io/api/v2/organizations/${TFC_ORG}/workspaces/${TFC_WORKSPACE_NAME}"
        status_code=$(curl -sS -o /dev/null -w "%{http_code}" \
          -H "Authorization: Bearer ${TFC_TOKEN}" \
          -H "Content-Type: application/vnd.api+json" \
          "${workspace_url}")

        tags_payload=$(printf '%s\n' "${WORKSPACE_TAGS//,/ }" | tr ' ' '\n' | sed '/^$/d' | jq -R . | jq -s '{data: map({type: "tags", attributes: {name: .}})}')

        workspace_id=""
        workspace_exists="false"

        if [ "${status_code}" = "200" ]; then
          workspace_exists="true"
          workspace_id=$(curl -sS \
            -H "Authorization: Bearer ${TFC_TOKEN}" \
            -H "Content-Type: application/vnd.api+json" \
            "${workspace_url}" | jq -r '.data.id')
        elif [ "${status_code}" = "404" ]; then
          if [ "${CREATE_IF_MISSING}" = "true" ]; then
            create_response=$(curl -sS -X POST \
              -H "Authorization: Bearer ${TFC_TOKEN}" \
              -H "Content-Type: application/vnd.api+json" \
              --data "{\"data\":{\"type\":\"workspaces\",\"attributes\":{\"name\":\"${TFC_WORKSPACE_NAME}\",\"execution-mode\":\"${EXECUTION_MODE}\"}}}" \
              "https://app.terraform.io/api/v2/organizations/${TFC_ORG}/workspaces")
            workspace_id=$(echo "${create_response}" | jq -r '.data.id')
            workspace_exists="true"
          else
            echo "Workspace ${TFC_WORKSPACE_NAME} does not exist and create_if_missing=false."
          fi
        else
          echo "Unexpected Terraform Cloud API response: ${status_code}"
          exit 1
        fi

        if [ "${workspace_exists}" = "true" ]; then
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${TFC_TOKEN}" \
            -H "Content-Type: application/vnd.api+json" \
            --data "{\"data\":{\"id\":\"${workspace_id}\",\"type\":\"workspaces\",\"attributes\":{\"execution-mode\":\"${EXECUTION_MODE}\"}}}" \
            "https://app.terraform.io/api/v2/workspaces/${workspace_id}" \
            > /dev/null

          curl -sS -X POST \
            -H "Authorization: Bearer ${TFC_TOKEN}" \
            -H "Content-Type: application/vnd.api+json" \
            --data "${tags_payload}" \
            "https://app.terraform.io/api/v2/workspaces/${workspace_id}/relationships/tags" \
            > /dev/null || true
        fi

        echo "workspace_exists=${workspace_exists}" >> "${GITHUB_OUTPUT}"
        echo "workspace_id=${workspace_id}" >> "${GITHUB_OUTPUT}"
